<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race Companion — Magical Athlete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;600;700;800;900&family=Titan+One&display=swap" rel="stylesheet">
<style>
/* Design DNA v1: design-dna/magical-athlete.dna.json + Option A layout */
:root{
  --color-primary:#F01C03;
  --color-secondary:#FED42C;
  --color-accent:#20A1BF;
  --color-paper:#FCFBED;
  --color-white:#FFFFFF;
  --color-ink:#180A03;
  --color-ink-soft:#4D3B25;
  --color-muted-surface:#ECE7E6;
  --color-success:#558B07;
  --color-warning:#EB8212;
  --color-error:#E94107;
  --color-info:#599CCF;
  --color-pink:#DF76A5;
  --color-purple:#8D55CE;
  --color-wild:#F46D57; /* Provisional Wild Wilds marker */

  /* Compatibility aliases mapped to pure DNA tokens */
  --ink:var(--color-ink);
  --ink-muted:var(--color-ink-soft);
  --paper:var(--color-paper);
  --surface:var(--color-white);
  --paper-alt:var(--color-muted-surface);
  --yellow:var(--color-secondary);
  --yellow-soft:var(--color-paper);
  --coral:var(--color-wild);
  --coral-soft:var(--color-paper);
  --teal:var(--color-accent);
  --teal-deep:var(--color-ink);
  --teal-soft:var(--color-paper);
  --error:var(--color-error);

  --font-display:'Titan One','Bungee','Arial Black',sans-serif;
  --font-ui:'Nunito','Segoe UI',system-ui,sans-serif;
  --radius-sm:8px;
  --radius-card:14px;
  --radius-btn:14px;
  --radius-lg:20px;
  --shadow-low:2px 2px 0 #180A03;
  --shadow:4px 4px 0 #180A03;
  --shadow-lg:8px 8px 0 rgba(24,10,3,.9);
  --ease:cubic-bezier(.34,1.56,.64,1);
  --d-micro:120ms;
  --d-normal:250ms;
  --d-macro:500ms;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{
  margin:0;
  background:var(--color-secondary);
  color:var(--color-ink);
  font:16px/1.5 var(--font-ui);
  font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;
  overflow-x:clip;
}
main{
  max-width:1120px;
  margin:0 auto;
  padding:16px 14px calc(48px + env(safe-area-inset-bottom,0px));
}
@media(min-width:640px){
  main{padding:22px 24px calc(60px + env(safe-area-inset-bottom,0px))}
}

#confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
}

/* Header & Navigation */
.site-header{
  background:var(--color-primary);
  border-bottom:3px solid var(--color-ink);
}
.topbar{
  max-width:1120px;
  margin:0 auto;
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
@media(min-width:640px){
  .topbar{padding:14px 24px}
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.mark{
  flex:0 0 auto;
  display:grid;
  place-items:center;
  width:48px;
  height:48px;
  border:3px solid var(--color-ink);
  border-radius:12px;
  background:var(--color-white);
  box-shadow:var(--shadow-low);
}
.brand-title{
  display:block;
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(24px,5.2vw,38px);
  line-height:1;
  letter-spacing:.01em;
  color:var(--color-white);
  -webkit-text-stroke:1.5px var(--color-ink);
  paint-order:stroke fill;
  text-shadow:3px 3px 0 var(--color-ink);
}
.brand-sub{
  display:inline-block;
  margin-top:6px;
  padding:2px 10px;
  border-radius:999px;
  background:var(--color-ink);
  color:var(--color-secondary);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.steps{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:0 0 18px;
  padding:10px 12px;
  background:var(--color-paper);
  border:3px solid var(--color-ink);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow);
}
.step{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:2px solid var(--color-ink);
  background:var(--color-white);
  color:var(--color-ink-soft);
  padding:5px 11px;
  border-radius:999px;
  font-size:14px;
  font-weight:800;
  line-height:1.2;
}
.step-num{
  display:inline-grid;
  place-items:center;
  width:24px;
  height:24px;
  border-radius:50%;
  border:2px solid var(--c-pill,var(--color-ink));
  background:var(--color-white);
  color:var(--color-ink);
  font-family:var(--font-display);
  font-weight:400;
  font-size:13px;
  line-height:1;
}
.step.done{
  background:var(--color-success);
  color:var(--color-ink);
}
.step.done .step-num{
  background:var(--color-paper);
  color:var(--color-ink);
  border-color:var(--color-ink);
}
.step.current{
  background:var(--color-secondary);
  color:var(--color-ink);
  border-width:3px;
  box-shadow:var(--shadow-low);
}
.step.current .step-num{
  background:var(--color-ink);
  color:var(--color-secondary);
  border-color:var(--color-ink);
}

/* Typography */
h1,h2,h3{
  font-family:var(--font-display);
  font-weight:400;
  letter-spacing:.01em;
  line-height:1.08;
  margin:0;
}
h1{font-size:clamp(28px,5.6vw,46px);margin:4px 0 8px}
h2{font-size:24px;margin-bottom:8px}
h3{font-size:19px;margin-bottom:6px}
p{margin:0 0 10px;line-height:1.5}
p:last-child{margin-bottom:0}
small,.muted{color:var(--color-ink-soft);font-size:14px;font-weight:700}
.num-display{font-family:var(--font-display);font-weight:400}
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

/* Panels & Black Hero Banners */
.panel,details{
  background:var(--color-paper);
  border:3px solid var(--color-ink);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow);
  padding:16px;
  margin:0 0 16px;
}
.hero-panel{
  background:var(--color-ink);
  color:var(--color-white);
  border:3px solid var(--color-ink);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  padding:18px 20px 16px;
  margin:0 0 18px;
}
.hero-panel.hero-setup,
.hero-panel.hero-podium{
  background-image:radial-gradient(circle, rgba(255,255,255,.11) 1.5px, transparent 1.6px);
  background-size:12px 12px;
}
.hero-kicker{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--color-secondary);
  color:var(--color-ink);
  border:2px solid var(--color-ink);
  font-family:var(--font-display);
  font-weight:400;
  font-size:13px;
  letter-spacing:.03em;
  padding:4px 12px;
  border-radius:999px;
  margin-bottom:10px;
}
.hero-panel.hero-draft .hero-kicker{
  background:var(--color-pink);
  color:var(--color-ink);
}
.hero-sub{
  color:var(--color-paper);
  font-weight:700;
  font-size:16px;
  margin:10px 0 0;
  line-height:1.45;
}
.hero-sub b{color:var(--color-secondary)}
.rw-letter{
  display:inline-block;
  animation:pop var(--d-macro) var(--ease) both;
}
@keyframes pop{
  from{transform:scale(.45) rotate(-8deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}
@keyframes die-shake{
  0%,100%{transform:rotate(0) scale(1)}
  25%{transform:rotate(-10deg) scale(1.06)}
  50%{transform:rotate(10deg) scale(1.06)}
  75%{transform:rotate(-6deg) scale(1.03)}
}

/* Badges & Tags */
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--color-ink);
  color:var(--color-secondary);
  font-family:var(--font-display);
  font-weight:400;
  font-size:14px;
  letter-spacing:.03em;
  padding:5px 12px;
  border-radius:var(--radius-sm);
  margin:0 0 10px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-height:28px;
  padding:3px 10px;
  border:2px solid var(--color-ink);
  border-radius:999px;
  background:var(--color-white);
  color:var(--color-ink);
  font-size:14px;
  font-weight:800;
  line-height:1.2;
}
.pill-yellow{background:var(--color-secondary);color:var(--color-ink)}
.pill-teal,.pill-teal-solid{background:var(--color-accent);color:var(--color-ink)}
.pill-coral,.pill-coral-solid{background:var(--color-wild);color:var(--color-ink)}
.pill-purple{background:var(--color-purple);color:var(--color-white)}
.pill-green{background:var(--color-success);color:var(--color-ink)}
.pill-orange{background:var(--color-warning);color:var(--color-ink)}
.pill-blue{background:var(--color-info);color:var(--color-ink)}
.pill-pink{background:var(--color-pink);color:var(--color-ink)}
.pill-error{background:var(--color-error);color:var(--color-ink)}
.pill-ink{background:var(--color-ink);color:var(--color-white)}
.pill-white{background:var(--color-white);color:var(--color-ink)}
.pill-muted{background:var(--color-muted-surface);color:var(--color-ink-soft)}

/* Layout Helpers */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.grid,.names{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));
  gap:14px;
}
.grid-2{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));
  gap:12px;
}

/* Controls & Touch Targets (>= 44x44px, 16px input text) */
button,input,select,textarea{
  font:16px/1.3 var(--font-ui);
  border-radius:var(--radius-btn);
  color:var(--color-ink);
  touch-action:manipulation;
}
button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:48px;
  min-width:44px;
  padding:10px 16px;
  border:3px solid var(--color-ink);
  background:var(--color-white);
  cursor:pointer;
  font-weight:800;
  box-shadow:var(--shadow-low);
  text-align:center;
  transition:transform var(--d-micro) var(--ease),background-color var(--d-micro) var(--ease),box-shadow var(--d-micro) var(--ease);
}
button:hover:not(:disabled){
  transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 var(--color-ink);
}
button:active:not(:disabled){
  transform:translate(2px,2px);
  box-shadow:0 0 0 var(--color-ink);
}
button.primary{
  background:var(--color-primary);
  color:var(--color-white);
  font-family:var(--font-display);
  font-weight:400;
  font-size:24px;
  letter-spacing:.02em;
  line-height:1.1;
  text-shadow:2px 2px 0 var(--color-ink);
  box-shadow:var(--shadow);
  padding:12px 18px;
}
button.primary:hover:not(:disabled){
  background:var(--color-primary);
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 var(--color-ink);
}
button.primary:active:not(:disabled){
  transform:translate(2px,2px);
  box-shadow:var(--shadow-low);
}
button.btn-teal{
  background:var(--color-accent);
  color:var(--color-ink);
}
button.btn-coral{
  background:var(--color-wild);
  color:var(--color-ink);
}
button.btn-block{
  width:100%;
}
button:disabled{
  background:var(--color-muted-surface);
  color:var(--color-ink-soft);
  cursor:not-allowed;
  box-shadow:none;
}
input,select,textarea{
  width:100%;
  background:var(--color-white);
  color:var(--color-ink);
  border:2px solid var(--color-ink);
  border-radius:12px;
  padding:10px 12px;
  min-height:48px;
  font-size:16px;
  font-weight:700;
}
textarea{min-height:76px;resize:vertical}
label{display:block;margin:0 0 10px}
label:last-child{margin-bottom:0}
label>span{
  display:block;
  margin-bottom:5px;
  font-family:var(--font-display);
  font-weight:400;
  font-size:15px;
  color:var(--color-ink);
}
summary{
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:400;
  font-size:18px;
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  list-style:none;
}
summary::-webkit-details-marker{display:none}
summary::after{
  content:"+";
  display:inline-grid;
  place-items:center;
  width:30px;
  height:30px;
  border:2px solid var(--color-ink);
  border-radius:8px;
  background:var(--color-secondary);
  font-family:var(--font-display);
  font-size:18px;
  flex:0 0 auto;
}
details[open]>summary::after{
  content:"−";
  background:var(--color-accent);
}
details[open]>summary{
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:3px solid var(--color-ink);
}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{
  outline:3px solid var(--color-ink);
  outline-offset:2px;
  box-shadow:0 0 0 6px var(--color-secondary);
}
[tabindex="-1"]:focus{outline:none;box-shadow:none}
#undo{
  white-space:nowrap;
  flex-shrink:0;
  width:auto;
  background:var(--color-paper);
  color:var(--color-ink);
  font-family:var(--font-display);
  font-weight:400;
  font-size:16px;
}
form{margin:0}
.error{
  background:var(--color-error);
  color:var(--color-ink);
  border:3px solid var(--color-ink);
  border-radius:var(--radius-sm);
  padding:8px 12px;
  font-weight:800;
  min-height:22px;
  margin:10px 0;
}
.error:empty{display:none}

/* Seat cards (Setup) */
.seat-card{
  background:var(--color-white);
  border:3px solid var(--color-ink);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-low);
  padding:12px;
}
.seat-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:800;
  margin-bottom:8px;
}
.seat-num{
  display:inline-grid;
  place-items:center;
  width:28px;
  height:28px;
  border:2px solid var(--color-ink);
  border-radius:8px;
  font-family:var(--font-display);
  font-weight:400;
  font-size:16px;
}

/* Snake Draft & How-to */
.howto{
  background:var(--color-paper);
  border:3px solid var(--color-ink);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow);
  padding:14px 16px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:16px;
}
.howto-step{
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:800;
  font-size:14px;
  line-height:1.3;
  flex:1 1 200px;
}
.howto-num{
  flex:0 0 auto;
  width:34px;
  height:34px;
  border-radius:999px;
  border:3px solid var(--color-ink);
  display:grid;
  place-items:center;
  font-family:var(--font-display);
  font-size:16px;
  background:var(--c-pill,var(--color-white));
  color:var(--color-ink);
}
.tray{
  background:var(--color-ink);
  color:var(--color-white);
  border:3px solid var(--color-ink);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  padding:18px;
  margin-bottom:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.tray-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
.tray h2{
  color:var(--color-white);
  font-size:22px;
  margin:0;
}
.tray h2 em{
  font-style:normal;
  color:var(--color-secondary);
}
.slots{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
}
.slot{
  min-height:64px;
  border:3px dashed rgba(255,255,255,.45);
  border-radius:var(--radius-card);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:var(--color-paper);
  font-family:var(--font-display);
  font-size:14px;
  padding:8px 6px;
  text-align:center;
}
.slot.filled{
  border-style:solid;
  border-color:var(--color-ink);
  background:var(--color-paper);
  color:var(--color-ink);
  box-shadow:var(--shadow-low);
}
.slot.filled b{
  font-family:var(--font-display);
  font-weight:400;
  font-size:15px;
  line-height:1.1;
}
.dna-card-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}
@media(max-width:1024px){
  .dna-card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:640px){
  .dna-card-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
@media(max-width:359px){
  .dna-card-grid{grid-template-columns:1fr}
}
.dna-card{
  position:relative;
  background:var(--color-paper);
  border:3px solid var(--color-ink);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:transform var(--d-normal) var(--ease),box-shadow var(--d-normal) var(--ease);
}
.dna-card:hover{
  transform:translateY(-4px) rotate(-1deg);
  box-shadow:6px 8px 0 var(--color-ink);
}
.dna-card.drafted{
  box-shadow:6px 8px 0 var(--color-ink);
  outline:3px solid var(--color-success);
  outline-offset:-3px;
}
.dna-card .band{
  height:16px;
  background:var(--c,var(--color-primary));
  border-bottom:3px solid var(--color-ink);
}
.dna-card .art{
  height:86px;
  display:grid;
  place-items:center;
  position:relative;
  background:var(--color-paper);
  border-bottom:2px solid var(--color-ink);
}
.dna-card .art .initial{
  display:grid;
  place-items:center;
  width:56px;
  height:56px;
  border-radius:14px;
  border:3px solid var(--color-ink);
  background:var(--c,var(--color-primary));
  color:var(--c-fg,var(--color-ink));
  box-shadow:var(--shadow-low);
  font-family:var(--font-display);
  font-size:34px;
  line-height:1;
}
.dna-card .art .die{
  position:absolute;
  right:8px;
  bottom:8px;
  width:28px;
  height:28px;
}
.dna-card .body{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:1;
}
.dna-card h3{
  font-family:var(--font-display);
  font-size:19px;
  line-height:1.05;
}
.card-power-tag{
  display:inline-block;
  align-self:flex-start;
  background:var(--c,var(--color-secondary));
  color:var(--c-fg,var(--color-ink));
  border:2px solid var(--color-ink);
  border-radius:6px;
  padding:2px 7px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
}
.dna-card p{
  font-size:14px;
  line-height:1.4;
  color:var(--color-ink-soft);
  flex:1;
  margin:0;
}
.dna-card .draft-btn{
  margin-top:8px;
  width:100%;
  min-height:44px;
  padding:8px 10px;
  background:var(--color-primary);
  color:var(--color-white);
  font-family:var(--font-ui);
  font-weight:900;
  font-size:19px;
  letter-spacing:.03em;
  text-shadow:2px 2px 0 var(--color-ink);
}
.dna-card.drafted .draft-btn{
  background:var(--color-paper);
  color:var(--color-ink);
  text-shadow:none;
}
.slot-tag{
  display:inline-block;
  border:2px solid var(--color-ink);
  border-radius:999px;
  padding:1px 7px;
  font-family:var(--font-ui);
  font-size:11px;
  font-weight:900;
  letter-spacing:.04em;
}
.tray-others{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding-top:10px;
  border-top:2px solid rgba(255,255,255,.22);
}

const button=(label,action,extra='',primary=false)=>'<button type="button" data-action="'+action+'" '+extra+(primary?' class="primary"':'')+'>'+label+'</button>';
function rainbowText(text){
  let ci=0;
  return String(text||'').split(/(\s+)/).map(tok=>{
    if(/^\s+$/.test(tok))return tok;
    const letters=[...tok].map(ch=>{
      const c=DNA_RAINBOW[ci%DNA_RAINBOW.length];
      const delay=ci*35;
      ci++;
      return '<span class="rw-letter" style="color:'+c+';animation-delay:'+delay+'ms">'+esc(ch)+'</span>';
    }).join('');
    return '<span style="display:inline-block;white-space:nowrap">'+letters+'</span>';
  }).join('');
}

const racerNames=Object.keys(racerPowers).sort((a,b)=>a.localeCompare(b));
const normalize=name=>String(name||'').trim().toLowerCase();
const presetName=name=>racerNames.find(racer=>normalize(racer)===normalize(name));
function racerColor(name){
  const p=presetName(name);
  if(p){
    if(RACER_OVERRIDE[p])return RACER_OVERRIDE[p];
    const idx=racerNames.indexOf(p);
    return DNA_RACER_PALETTE[idx%DNA_RACER_PALETTE.length];
  }
  let h=0;
  for(const ch of String(name||''))h=(h*31+ch.charCodeAt(0))>>>0;
  return DNA_RACER_PALETTE[h%DNA_RACER_PALETTE.length];
}
const racerFg=hex=>String(hex).toUpperCase()==='#8D55CE'?'#FFFFFF':'#180A03';
function raceTokenColors(players){
  const used=new Set();
  return (players||[]).map((p,i)=>{
    const a=athlete(p);
    let c=racerColor(a?.name||('Racer '+i));
    if(used.has(c)){
      const alt=DNA_RACER_PALETTE.find(col=>!used.has(col));
      if(alt)c=alt;
    }
    used.add(c);
    return c;
  });
}

/* Confetti — DNA particle_systems: Canvas 2D, 120–200 pieces, rect+circle,
   gravity + flutter, racer palette + white. Disabled on reduced motion. */
const confettiReduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const confettiCv=document.getElementById('confetti');
const confettiCtx=confettiCv?confettiCv.getContext('2d'):null;
let confettiParts=[], confettiRaf=null;
function sizeConfetti(){if(confettiCv){confettiCv.width=window.innerWidth;confettiCv.height=window.innerHeight}}
sizeConfetti();
window.addEventListener('resize',sizeConfetti);
function confettiTick(){
  if(!confettiCtx)return;
  confettiCtx.clearRect(0,0,confettiCv.width,confettiCv.height);
  confettiParts=confettiParts.filter(p=>p.y<confettiCv.height+30);
  for(const p of confettiParts){
    p.y+=p.vy;p.x+=p.vx+Math.sin(p.y/30)*0.8;p.rot+=p.vr;
    confettiCtx.save();confettiCtx.translate(p.x,p.y);confettiCtx.rotate(p.rot);confettiCtx.fillStyle=p.color;
    if(p.circle){confettiCtx.beginPath();confettiCtx.arc(0,0,p.w/2,0,7);confettiCtx.fill();}
    else confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    confettiCtx.restore();
  }
  confettiRaf=confettiParts.length?requestAnimationFrame(confettiTick):(confettiCtx.clearRect(0,0,confettiCv.width,confettiCv.height),null);
}
window.confettiBurst=function(n=160){
  if(!confettiCtx||confettiReduced())return;
  const palette=[...DNA_RACER_PALETTE,'#FFFFFF'];
  for(let i=0;i<n;i++){
    confettiParts.push({
      x:Math.random()*confettiCv.width,
      y:-20-Math.random()*80,
      w:6+Math.random()*8,
      h:6+Math.random()*8,
      vy:2+Math.random()*3,
      vx:-1.5+Math.random()*3,
      rot:Math.random()*Math.PI,
      vr:-0.1+Math.random()*0.2,
      color:palette[Math.floor(Math.random()*palette.length)],
      circle:Math.random()<0.35
    });
  }
  if(!confettiRaf)confettiTick();
};

function draftAthlete(name, power){
  if(!name||!power||state.players.some(p=>p.team.some(a=>a.name.toLowerCase()===name.toLowerCase()))){
    const err=screen.querySelector('.error');
    if(err)err.textContent=name?'Atlet itu sudah masuk tim lain — pilih yang masih tersedia!':'Masukkan nama atlet lebih dulu.';
    return false;
  }
  change(()=>{
    state.players[draftPlayer()].team.push({name,...power,powerSet:true});
    state.turn++;
    if(state.turn===state.slots*state.players.length){
      state.stage=2;
      window.confettiBurst?.(160);

  },state.turn+1===state.slots*state.players.length);

function announceTurn(){
  let msg='Tahap '+stages[state.stage];
  let taskKey=String(state.stage);
  if(state.stage===1&&state.players.length){
    const p=state.players[draftPlayer()];
    msg='Snake draft: giliran '+p.name+', pick '+(state.turn+1)+' dari '+state.players.length*state.slots;
    taskKey='1-'+state.turn;
  }else if(state.stage===5&&state.gm){
    const activeName=referee.name(state,state.active);
    const t=state.gm.q[0];
    const desc=t?.type==='roll'?'Masukkan hasil dadu fisik':t?.title||(t?.type==='confirmMove'?'Konfirmasi langkah utama':t?.type||'');
    msg='Giliran '+activeName+' ('+state.players[state.active].name+'). '+desc;
    taskKey='5-'+state.active+'-'+state.gm.turn+'-'+state.gm.q.length+'-'+(t?.type||'')+'-'+(t?.title||'');
  }
  if(msg!==lastAnnounced){
    announcer.textContent=msg;
    lastAnnounced=msg;
  }
  if(shouldShiftFocus&&taskKey!==lastTaskKey){
    shouldShiftFocus=false;
    const target=document.querySelector('#task-focus')||document.querySelector('#stage-focus');
    if(target)target.focus({preventScroll:true});
  }
  lastTaskKey=taskKey;
  shouldShiftFocus=false;
}

  if(state.stage===3){
    screen.innerHTML=heading('PILIH ATLET · RACE '+state.round,'Setiap pemain memilih satu atlet yang masih tersedia untuk turun ke lintasan.','LINEUP RACE '+state.round)+
      '<form id="pick" novalidate><div class="grid">'+players.map((p,i)=>pickCardMarkup(p,i)).join('')+'</div><p class="error" aria-live="polite"></p><div class="panel" style="margin-top:14px"><button class="primary btn-block">CEK PRE-RACE!</button></div></form>';
    announceTurn();
    return;
  }
  if(state.stage===4){screen.innerHTML=tablePre();announceTurn();return}
  if(state.stage===5){screen.innerHTML=tableRace();announceTurn();return}
  screen.innerHTML=tableResults();
  if(lastResultsRound!==state.round){
    lastResultsRound=state.round;
    window.confettiBurst?.(180);
  }
  announceTurn();
}

function drawNames(){
  const box=document.querySelector('#names'),count=Number(document.querySelector('#count').value), prev=[...box.querySelectorAll('input')].map(n=>n.value);
  box.innerHTML=Array.from({length:count},(_,i)=>{
    const c=DNA_RACER_PALETTE[i%DNA_RACER_PALETTE.length];
    return '<div class="seat-card"><div class="seat-badge"><span class="seat-num" style="background:'+c+';color:'+racerFg(c)+'">'+(i+1)+'</span><span>'+(i===0?'Kursi 1 · Draft pertama':'Kursi '+(i+1))+'</span></div><input name="p'+i+'" aria-label="Nama Pemain '+(i+1)+'" maxlength="40" placeholder="Pemain '+(i+1)+'" value="'+esc(prev[i])+'"></div>';
  }).join('');
}

screen.addEventListener('input',e=>{
  if(e.target.id==='draft-search'){
    const cards=document.querySelector('#draft-cards');
    if(cards)cards.innerHTML=draftGridMarkup(e.target.value);
  }
});
screen.addEventListener('change',e=>{
  if(e.target.id==='count')drawNames();
  if(e.target.name==='track'&&state.stage===4){
    const preview=document.querySelector('#prerace-track-note');
    if(preview){
      const isWild=e.target.value==='wild';
      preview.className='track-card '+(isWild?'wild':'mild');
      preview.innerHTML='<strong style="font-family:var(--font-display);font-size:18px">'+(isWild?'Wild Wilds':'Mild Mile')+'</strong><br><span>'+(isWild?'Bintang (+1 poin) · Batu (tersandung) · Panah (geser posisi & picu reaksi)':'Lintasan mulus 30 petak tanpa efek petak khusus.')+'</span>'+(isWild?'<br><small>Catatan: Wild memakai warna provisional (#F46D57), menunggu referensi foto sisi balik track fisik.</small>':'');
    }
  }
});
screen.addEventListener('submit',e=>{
  e.preventDefault();const data=new FormData(e.target);
  if(e.target.id==='setup')change(()=>{state.slots=Number(data.get('slots'));state.players=Array.from({length:Number(data.get('count'))},(_,i)=>({name:data.get('p'+i).trim()||'Pemain '+(i+1),team:[],used:[]}));state.stage=1},true);
  if(e.target.id==='draft'){
    const name=String(data.get('athlete')||'').trim();
    const power=Object.fromEntries(rules.map(([k])=>[k,String(data.get(k)||'').trim()]));
    draftAthlete(name,power);
  }
  if(e.target.id==='pick'){
    const missing=state.players.find((_,i)=>!data.get('pick'+i));
    if(missing){
      const err=screen.querySelector('.error');
      if(err)err.textContent='Ups, '+missing.name+' belum pilih atlet buat turun ke start!';
      return;
    }
    change(()=>{state.players.forEach((p,i)=>{p.pick=Number(data.get('pick'+i))});state.stage=4},true);
  }
  if(e.target.id==='start')change(()=>{
    state.track=data.get('track');
    state.stage=5;
    referee.start(state,Number(data.get('first')));
  },true);
  if(e.target.id.startsWith('gm-'))change(()=>refereeForm(e.target.id,data),false);
});
screen.addEventListener('click',e=>{
  const draftBtn=e.target.closest('button[data-draft-racer]');
  if(draftBtn&&!draftBtn.disabled){
    const name=draftBtn.dataset.draftRacer;
    draftAthlete(name,racerPowers[name]);
    return;
  }
  const pickBtn=e.target.closest('button[data-pick-player]');
  if(pickBtn){
    const pi=pickBtn.dataset.pickPlayer, val=pickBtn.dataset.pickVal;
    const select=document.querySelector('#pick-select-'+pi);
    if(select)select.value=val;
    pickBtn.parentElement.querySelectorAll('button[data-pick-player]').forEach(btn=>{
      const on=btn===pickBtn;
      btn.setAttribute('aria-pressed',String(on));
      btn.classList.toggle('is-picked',on);
    });
    const err=screen.querySelector('.error');
    if(err)err.textContent='';
    return;
  }
  const b=e.target.closest('button[data-action]');if(!b)return;
  const action=b.dataset.action,index=Number(b.dataset.index);
  if(action==='reset'&&!confirm('Mulai permainan baru?'))return;
  change(()=>{
    switch(action){
      case 'save-rules': {
        const {player,athlete}=b.dataset;
        b.closest('details').querySelectorAll('textarea').forEach(t=>{state.players[player].team[athlete][t.dataset.rule]=t.value.trim();state.players[player].team[athlete].powerSet=true});
        savedToastKey=player+'-'+athlete;
        break;
      }
      case 'pick':savedToastKey='';state.stage=3;break;
      case 'gm-choice':referee.take(state,'choice',index);break;
      case 'gm-roll':referee.take(state,'roll',index);break;
      case 'gm-confirm':referee.take(state,'confirmMove');break;
      case 'gm-notice':referee.take(state,'notice');break;
      case 'gm-no-egg':referee.take(state,'egg');break;
      case 'gm-resume':referee.resume(state);break;
      case 'round':state.players.forEach(p=>p.used.push(p.pick));state.round++;delete state.track;delete state.gm;state.placed=[];state.log=[];state.die=0;state.stage=3;break;
      case 'reset':state=initial();break;
    }
  },['pick','round','reset'].includes(action));
});
document.querySelector('#undo').addEventListener('click',()=>{
  if(history.length){
    state=history.pop();
    persist();
    shouldShiftFocus=true;
    render();
  }
});
screen.addEventListener('pointerdown',e=>{
  const die=e.target.closest('.die-btn');
  if(die&&!confettiReduced())die.classList.add('is-rolling');
});
render();
</script>
</html>
